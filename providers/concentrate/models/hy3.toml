# Live probes on 2026-08-19 confirmed `none` returns an empty reasoning payload, so
# thinking is genuinely off, while the graded levels return reasoning. The graded
# values are the tiers Concentrate declares for this model, not measured budgets.
# `xhigh` is accepted but not published: live probes on 2026-08-19 produced 34_516
# and 34_602 reasoning characters at high against 34_168 and 35_336 at xhigh, so the
# gateway normalizes it rather than honouring a distinct tier. Peers publish
# low|medium|high|max for this model.
# https://concentrate.ai/models/hy3
base_model = "tencent/hy3"
attachment = true
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[cost]
input = 0.14
output = 0.58
cache_read = 0.035

[limit]
context = 262_144

[modalities]
input = ["text", "pdf"]
