# `none` is not published: only 2 of 3 routes accept it,
# so it would be normalized away rather than disabling thinking. The graded values
# are the tiers Concentrate declares for this model, not measured budgets.
# https://concentrate.ai/models/qwen3.7-max
base_model = "alibaba/qwen3.7-max"
attachment = true
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 1.25
output = 3.75
cache_read = 0.25

[modalities]
input = ["text", "pdf"]
