# Concentrate reports max_input_tokens = 128_000 for this ID and its single mistral route reports the same window.
# The override records the window this gateway actually serves, which differs
# from the lab ceiling.
# https://concentrate.ai/models/mistral-medium-3
base_model = "mistral/mistral-medium-2505"
structured_output = true

[cost]
input = 0.4
output = 2

[limit]
context = 128_000
output = 32_000

[modalities]
input = ["text", "image", "pdf"]
