# Live probes on 2026-08-19 confirmed `none` returns an empty reasoning payload, so
# thinking is genuinely off, while the graded levels return reasoning. The graded
# values are the tiers Concentrate declares for this model, not measured budgets.
# `xhigh` is accepted but not published: live probes on 2026-08-19 produced
# 9_266-12_944 reasoning characters at high against 10_674-13_600 at xhigh, which
# overlap, so no distinct higher tier could be demonstrated.
# https://concentrate.ai/models/qwen3.5-27b
base_model = "alibaba/qwen3.5-27b"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[cost]
input = 0.26
output = 2.6

[limit]
output = 32_768

[modalities]
input = ["text", "image", "pdf"]
