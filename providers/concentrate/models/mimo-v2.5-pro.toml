# Live probes on 2026-08-19 confirmed `none` returns an empty reasoning payload, so
# thinking is genuinely off, while the graded levels return reasoning. The graded
# values are the tiers Concentrate declares for this model, not measured budgets.
# `max` is accepted but not published: live probes on 2026-08-19 produced a mean
# of 7_138 reasoning characters at high against 7_206 at max, within run-to-run
# noise, so the gateway normalizes it rather than honouring a higher tier.
# https://concentrate.ai/models/mimo-v2.5-pro
base_model = "xiaomi/mimo-v2.5-pro"
attachment = true
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 0.522
output = 1.044
cache_read = 0.0043

[modalities]
input = ["text", "pdf"]
