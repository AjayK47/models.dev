# `none` is not published: only 1 of 2 routes accept it,
# so it would be normalized away rather than disabling thinking. The graded values
# are the tiers Concentrate declares for this model, not measured budgets.
# `max` is declared in the list capabilities but no route reports
# support for it, so it is omitted.
# https://concentrate.ai/models/mimo-v2.5
base_model = "xiaomi/mimo-v2.5"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 0.168
output = 0.336
cache_read = 0.0034

[modalities]
input = ["text", "image", "pdf"]
