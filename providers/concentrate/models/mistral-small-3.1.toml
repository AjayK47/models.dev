# Concentrate accepts PDF input for every model it serves: the gateway extracts the
# document server-side before dispatch, so the capability is the relay's rather than
# the lab's. Verified on 2026-08-19 by sending a PDF to text-only-lab models
# (qwen3-max, deepseek-v3-0324, glm-4.5), each of which returned its contents.
base_model = "mistral/mistral-small-3-1-24b-instruct-2503"

[cost]
input = 0.351
output = 0.555

[limit]
output = 8_192

[modalities]
input = ["text", "pdf"]
