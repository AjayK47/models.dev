# Live probes on 2026-08-19 confirmed `none` returns an empty reasoning payload, so
# thinking is genuinely off, while the graded levels return reasoning. The graded
# values are the tiers Concentrate declares for this model, not measured budgets.
# https://concentrate.ai/models/kimi-k3
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 2.85
output = 14.25
cache_read = 0.285

[modalities]
input = ["text", "image", "pdf"]
