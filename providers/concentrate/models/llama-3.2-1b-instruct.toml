# Concentrate reports max_input_tokens = 60_000 for this ID and its single cloudflare route reports the same window.
# The override records the window this gateway actually serves, which differs
# from the lab ceiling.
# https://concentrate.ai/models/llama-3.2-1b-instruct
base_model = "meta/llama-3.2-1b"
attachment = true
tool_call = true
structured_output = false

[cost]
input = 0.027
output = 0.201

[limit]
context = 60_000
output = 2_048

[modalities]
input = ["text", "pdf"]
