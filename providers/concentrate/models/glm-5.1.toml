# Concentrate normalizes `reasoning_effort` over Z.ai's thinking API. Live probes
# on 2026-08-19 confirmed `none` returns an empty reasoning payload, so thinking is genuinely off,
# while every graded level returns reasoning. Repeated runs did not show a stable
# ordering between the graded levels, so they are published as the tiers this
# gateway accepts rather than as measured reasoning budgets.
# `minimal` is omitted: the list capabilities do not declare it for this model,
# even though some individual upstream routes accept the value.
# https://concentrate.ai/models/glm-5.1
base_model = "zhipuai/glm-5.1"
attachment = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.825
output = 3.301
cache_read = 0.165

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 1.1
output = 3.851
cache_read = 0.22

[limit]
context = 204_800

[modalities]
input = ["text", "pdf"]
