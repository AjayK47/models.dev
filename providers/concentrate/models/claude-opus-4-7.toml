# Concentrate exposes the off switch as `reasoning_effort: none` rather than a
# separate toggle, and every route declares it. Live probes on 2026-08-19 with an
# identical prompt used 1251 completion tokens at none against 2083 at high, so it
# genuinely reduces thinking rather than being normalized away.
# https://concentrate.ai/models/claude-opus-4-7
base_model = "anthropic/claude-opus-4-7"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 5
output = 25
cache_read = 0.5
