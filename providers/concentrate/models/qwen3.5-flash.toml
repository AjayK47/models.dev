# Live probes on 2026-08-19 confirmed `none` returns an empty reasoning payload, so
# thinking is genuinely off, while the graded levels return reasoning. The graded
# values are the tiers Concentrate declares for this model, not measured budgets.
# https://concentrate.ai/models/qwen3.5-flash
base_model = "alibaba/qwen3.5-flash"
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "medium"]

[cost]
input = 0.029
output = 0.287

[[cost.tiers]]
tier = { type = "context", size = 256_000 }
input = 0.172
output = 1.72

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 0.115
output = 1.147

[limit]
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
