# `none` is not published: the list capabilities do not declare it, so it would be
# normalized away rather than disabling thinking. The graded values are the tiers
# Concentrate declares for this model, not measured reasoning budgets.
# https://concentrate.ai/models/step-3-7-flash
base_model = "stepfun/step-3.7-flash"
base_model_omit = ["limit.input"]
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.2
output = 1.15
cache_read = 0.04

[limit]
context = 262_144

[modalities]
input = ["text", "image"]
