# Concentrate normalizes `reasoning_effort` over Z.ai's thinking API. Live probes
# on 2026-08-19 confirmed this model always reasons; no route-wide off switch is exposed,
# while every graded level returns reasoning. Repeated runs did not show a stable
# ordering between the graded levels, so they are published as the tiers this
# gateway accepts rather than as measured reasoning budgets.
# `none` is omitted: only the deepinfra route accepts it, so on the bedrock and
# cloudflare routes it would be normalized away rather than disabling thinking.
# https://concentrate.ai/models/glm-4.7-flash
base_model = "zhipuai/glm-4.7-flash"
attachment = true
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.06
output = 0.4
cache_read = 0.01

[limit]
context = 202_752

[modalities]
input = ["text", "pdf"]
